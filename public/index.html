<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.png">
<title>C Practice</title>
<script>
  // Old links (./#problem=id) open the problem straight in the editor.
  if (/(^#|&)problem=/.test(location.hash)) location.replace('play.html' + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Sarabun:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<script src="js/loader.js"></script>
<style>
  :root {
    --panel-w: clamp(340px, 28vw, 420px);
    --map-bg: #eceae4; --map-dot: rgba(0, 0, 0, .10); --map-line: rgba(0, 0, 0, .045);
    --tk-edge: rgba(0, 0, 0, .16); --tk-shadow: rgba(0, 0, 0, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --map-bg: #0c0c0e; --map-dot: rgba(255, 255, 255, .09); --map-line: rgba(255, 255, 255, .03);
      --tk-edge: rgba(255, 255, 255, .16); --tk-shadow: rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --map-bg: #0c0c0e; --map-dot: rgba(255, 255, 255, .09); --map-line: rgba(255, 255, 255, .03);
    --tk-edge: rgba(255, 255, 255, .16); --tk-shadow: rgba(0, 0, 0, .35);
  }

  body { overflow: hidden; }

  /* ---------- top bar: links (left), time left (center), the student and their clan (right) ---------- */
  :root { --nav-h: 72px; }
  .topnav {
    position: relative; z-index: 5; height: var(--nav-h); padding: 0 20px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px;
    background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: 0 6px 20px rgba(0, 0, 0, .08);
  }
  .tn-left { justify-self: start; display: flex; align-items: center; gap: 10px; }
  /* the clan's score and money, top-left */
  .stat {
    display: flex; align-items: center; gap: 8px; padding: 4px 16px 4px 6px; border-radius: 14px;
    background: var(--surface-2); border: 1px solid var(--border); line-height: 1.05;
  }
  .stat img { width: 38px; height: 38px; display: block; flex: none; }
  .stat b { display: block; font: 700 1.3rem var(--font-mono); font-variant-numeric: tabular-nums; color: var(--stat-c); }
  .stat small { font: 700 .58rem var(--font-ui); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .stat.score { --stat-c: #b7791f; }
  .stat.money { --stat-c: #2f855a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat.score { --stat-c: #f6c445; } :root:not([data-theme="light"]) .stat.money { --stat-c: #86c96b; } }
  :root[data-theme="dark"] .stat.score { --stat-c: #f6c445; }
  :root[data-theme="dark"] .stat.money { --stat-c: #86c96b; }
  .stat b.bump { animation: scoreBump .7s cubic-bezier(.2, .8, .2, 1); }
  .tn-right { justify-self: end; display: flex; align-items: center; gap: 16px; min-width: 0; }
  /* the clan chip already shows the clan, so the account only needs the student's name */
  .tn-right:has(.clan-chip:not([hidden])) .acc-clan { display: none; }
  /* the picture is the only thing shown: hover it for the name, click it for Log out */
  .tn-right { position: relative; }
  .tn-right .clan-chip { cursor: pointer; padding: 0; border: 0; background: none; border-radius: 0; }
  .tn-right .acc-who { white-space: nowrap; }
  .tn-right .acc-out {
    position: absolute; top: 100%; right: 0; margin-top: 8px; z-index: 20; white-space: nowrap; display: none;
  }
  .tn-right.open .acc-out { display: block; }
  .clan-chip { padding: 5px; }

  /* the big countdown */
  .timer { display: flex; flex-direction: column; align-items: center; gap: 3px; line-height: 1; }
  .timer small { font: 700 .62rem var(--font-ui); letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
  .timer b { font: 700 2.3rem/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: .02em; transition: color .3s; }
  .timer.paused b, .timer.ready b { opacity: .55; }
  .timer.off b { color: var(--muted); opacity: .45; }
  .timer.low b { color: var(--err); animation: tick 1s ease-in-out infinite; }
  .timer.ended b { color: var(--err); font-size: 1.9rem; letter-spacing: .08em; }
  .timer.ended small { color: var(--err); }
  @keyframes tick { 50% { opacity: .55; } }

  /* data-panel="float": a card in the bottom-right corner of the map.
     data-panel="full":  a full-height column on the right side. */
  .home { position: relative; height: calc(100% - var(--nav-h)); display: grid; grid-template-columns: minmax(0, 1fr); }
  .home[data-panel="full"] { grid-template-columns: minmax(0, 1fr) var(--panel-w); }

  /* ---------- the map (blank for now: the world goes in #map-canvas) ---------- */
  .map {
    position: relative; overflow: hidden; background-color: var(--map-bg);
    background-image:
      radial-gradient(var(--map-dot) 1px, transparent 1.5px),
      linear-gradient(var(--map-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--map-line) 1px, transparent 1px);
    background-size: 22px 22px, 132px 132px, 132px 132px;
    background-position: 11px 11px, -1px -1px, -1px -1px;
  }
  .map::after { /* soft edge so the grid fades into the frame */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 45% 50%, transparent 55%, color-mix(in srgb, var(--map-bg) 85%, black 15%) 140%);
  }
  #map-canvas { position: absolute; inset: 0; }

  /* the board game (Unity web build from Game/BJKIT, files in public/game/) */
  .map.has-board::after { display: none; }
  #board-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .board-load {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(320px, 70%); display: grid; gap: 8px; text-align: center;
    font-size: .85rem; color: var(--muted);
  }
  .board-load .bar { height: 6px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .board-load .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: currentColor; transition: width .2s; }
  .board-load.failed .bar { display: none; }
  /* after the GIF loading screen goes, the board fades in from black */
  .board-fade { position: absolute; inset: 0; background: #000; pointer-events: none; transition: opacity 1.4s ease; }
  .board-fade.out { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .board-fade { transition-duration: .2s; } }

  /* the clan chip, right of the top bar: logo, name and the clan's score */
  .clan-chip {
    display: flex; align-items: center; gap: 12px; min-width: 0;
    padding: 5px 16px 5px 5px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-2);
  }
  .clan-logo {
    flex: none; width: 44px; height: 44px; padding: 7px; border-radius: 11px; display: block;
    background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .09) 0 2px, transparent 2px 7px), var(--clan);
    box-shadow: none;
  }
  .clan-name { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .clan-name small { font: 600 .6rem var(--font-mono); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  .clan-name b { font: 700 1rem var(--font-ui); white-space: nowrap; }
  .clan-score { display: flex; flex-direction: column; align-items: flex-end; padding-left: 14px; border-left: 1px solid var(--border); line-height: 1.1; }
  .clan-score b { font: 700 1.4rem var(--font-mono); color: color-mix(in srgb, var(--clan) 78%, var(--text)); }
  .clan-score small { font: 600 .6rem var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .clan-score b.bump { animation: scoreBump .7s cubic-bezier(.2, .8, .2, 1); }
  @keyframes scoreBump { 35% { transform: scale(1.25); } }

  /* ---------- the mission panel ---------- */
  .panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
  .home[data-panel="full"] .panel { border-left: 1px solid var(--border); box-shadow: -12px 0 40px rgba(0, 0, 0, .06); }
  .home[data-panel="float"] .panel {
    position: absolute; z-index: 3; right: 0; top: 0; bottom: 0; width: var(--panel-w);
    background: var(--surface);
    border: 0; border-left: 1px solid var(--border); border-radius: 0;
    box-shadow: none;
    animation: panelIn .45s cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes panelIn { from { opacity: 0; transform: translateY(16px) scale(.98); } }

  .panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0 18px; }
  .panel-head h1 {
    margin: 0 auto 0 0; display: flex; align-items: center; gap: 8px;
    font: 400 1.05rem/1 "Rye", var(--font-ui); letter-spacing: .06em; color: var(--brass-text);
  }

  /* brass accents (title, ticket rule) */
  :root { --brass-text: #a8761c; --sp1: #db2777; --sp2: #7c3aed; --sp3: #0284c7; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --brass-text: #e8c46a; --sp1: #f9a8d4; --sp2: #c4b5fd; --sp3: #7dd3fc; } }
  :root[data-theme="dark"] { --brass-text: #e8c46a; --sp1: #f9a8d4; --sp2: #c4b5fd; --sp3: #7dd3fc; }
  .collapse { flex: none; width: 28px; height: 28px; padding: 0; border-radius: 8px; line-height: 1; color: var(--muted); }
  .collapse .chev { display: inline-block; transition: transform .2s; }
  .panel.min .collapse .chev { transform: rotate(180deg); }
  .panel.min .filters, .panel.min .tickets { display: none; }
  .home[data-panel="float"] .panel.min { height: auto; min-height: 0; }
  .panel.min .panel-head { padding-bottom: 14px; }
  .home[data-panel="full"] .collapse { display: none; }

  .bar { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--text) 9%, transparent); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--c, var(--accent)); transition: width .7s cubic-bezier(.2, .8, .2, 1); }

  /* filters */
  .filters { padding: 12px 18px 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }

  /* star filter: click the 3rd star for level 3, click it again for all levels */
  .rating { display: flex; align-items: center; gap: 0; }
  .rating button {
    border: 0; background: transparent; padding: 2px 3px; border-radius: 6px;
    font: 1.3rem/1 "Segoe UI Symbol", system-ui, sans-serif;
    color: color-mix(in srgb, var(--text) 16%, transparent);
    transition: color .12s, transform .12s, text-shadow .12s;
  }
  .rating button:hover { transform: scale(1.18); }
  .rating button.on { color: var(--c); text-shadow: 0 0 10px color-mix(in srgb, var(--c) 45%, transparent); }
  .rating .sp { font-size: 1.1rem; margin-right: 6px; padding-right: 9px; border-right: 1px solid var(--border); border-radius: 0; }
  .rating .ex { font-size: 1.15rem; margin-right: 6px; padding-right: 9px; border-right: 1px solid var(--border); border-radius: 0; }
  .rating .sp.on { background: var(--lv-special); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  .seg { flex: 1; min-width: 180px; max-width: 230px; display: flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
  .seg button { flex: 1; border: 0; padding: 4px 8px; font-size: .8rem; color: var(--muted); background: transparent; border-radius: 7px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

  /* ticket list */
  .tickets { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 16px; scroll-behavior: smooth; }
  .group { margin-top: 12px; }
  .group:first-child { margin-top: 4px; }
  .group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .group-head .level { font-size: .88rem; }
  .group-head .gct { margin-left: auto; font: 600 .72rem var(--font-mono); color: var(--muted); }
  .group-head .bar { height: 4px; flex: 0 0 56px; }

  /* each ticket is a link straight to its problem */
  .tk-wrap {
    --c: var(--lv1); --edge: var(--tk-edge);
    display: block; margin-bottom: 9px; color: inherit; text-decoration: none; outline: none;
    filter: drop-shadow(0 0 .6px var(--edge)) drop-shadow(0 5px 10px var(--tk-shadow));
    transition: transform .18s cubic-bezier(.2, .8, .2, 1), filter .18s;
    animation: tkIn .35s cubic-bezier(.2, .8, .2, 1) backwards;
  }
  @keyframes tkIn { from { opacity: 0; transform: translateX(14px); } }
  .tk-wrap:hover, .tk-wrap:focus-visible {
    --edge: var(--c); transform: translateX(-5px);
    filter: drop-shadow(0 0 1.2px var(--edge)) drop-shadow(0 8px 18px color-mix(in srgb, var(--c) 22%, transparent));
  }
  .ticket {
    --stub: 62px;
    position: relative;
    display: grid; grid-template-columns: var(--stub) 1fr; min-height: 66px; border-radius: 12px; background: var(--surface);
    /* the two notches on the tear line */
    -webkit-mask: radial-gradient(circle 7px at var(--stub) 0, transparent 97%, #000) top / 100% 51% no-repeat,
                  radial-gradient(circle 7px at var(--stub) 100%, transparent 97%, #000) bottom / 100% 51% no-repeat;
            mask: radial-gradient(circle 7px at var(--stub) 0, transparent 97%, #000) top / 100% 51% no-repeat,
                  radial-gradient(circle 7px at var(--stub) 100%, transparent 97%, #000) bottom / 100% 51% no-repeat;
  }
  /* a thin brass rule just inside the edge, like an old stagecoach ticket */
  .ticket::after {
    content: ""; position: absolute; inset: 4px; border-radius: 10px; pointer-events: none;
    border: 1px solid color-mix(in srgb, var(--brass-text) 24%, transparent);
    transition: border-color .18s;
  }
  .tk-wrap:hover .ticket::after, .tk-wrap:focus-visible .ticket::after { border-color: color-mix(in srgb, var(--brass-text) 55%, transparent); }
  .stub {
    border-radius: 12px 0 0 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    color: var(--c); background: color-mix(in srgb, var(--c) 11%, var(--surface));
    border-right: 2px dashed color-mix(in srgb, var(--c) 35%, var(--border));
    transition: background .18s, color .18s;
  }
  .stub .no { font: 400 .68rem/1 "Rye", var(--font-ui); letter-spacing: .04em; opacity: .75; }
  .stub .num { font: 400 1.45rem/1.05 "Rye", var(--font-mono); }
  .tk-wrap:hover .stub, .tk-wrap:focus-visible .stub { background: var(--c); color: var(--surface); }

  /* special missions: the Special label's pink -> blue gradient, with a slow shimmer around the edge */
  .tk-wrap.special { --c: var(--sp1); }
  .tk-wrap.special .stub {
    position: relative; overflow: hidden;
    background: linear-gradient(160deg, color-mix(in srgb, var(--sp1) 16%, var(--surface)), color-mix(in srgb, var(--sp3) 16%, var(--surface)));
    border-right-color: color-mix(in srgb, var(--sp1) 45%, var(--border));
  }
  .tk-wrap.special .stub .no, .tk-wrap.special .stub .num, .tk-wrap.special .prog b {
    background: var(--lv-special); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tk-wrap.special .stub::before { /* a glint that sweeps across the stub now and then */
    content: ""; position: absolute; inset: -20% auto -20% -60%; width: 40%; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .22), transparent);
    animation: glint 5s ease-in-out infinite;
  }
  @keyframes glint { 0%, 70% { left: -60%; } 100% { left: 130%; } }
  .tk-wrap.special .ticket::after {
    inset: 3px; border: 1.5px solid transparent;
    background: linear-gradient(120deg, var(--sp1), var(--sp2), var(--sp3), var(--sp2), var(--sp1)) border-box;
    background-size: 300% 100%;
    -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: .75; animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer { to { background-position: 300% 0; } }
  .tk-wrap.special:hover .ticket::after, .tk-wrap.special:focus-visible .ticket::after { opacity: 1; }
  .tk-wrap.special .prog .bar > span, .group-head.special .bar > span { background: var(--lv-special); }
  .tk-wrap.special:hover .stub, .tk-wrap.special:focus-visible .stub { background: var(--lv-special); }
  .tk-wrap.special:hover .stub .no, .tk-wrap.special:hover .stub .num,
  .tk-wrap.special:focus-visible .stub .no, .tk-wrap.special:focus-visible .stub .num { background: none; color: #fff; }
  .tk-main { position: relative; min-width: 0; padding: 10px 14px 10px 16px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .tk-name { font: 600 .98rem/1.3 var(--font-ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 92px; }
  .tk-meta { display: flex; align-items: center; gap: 8px; padding-right: 92px; }
  /* [T][1][2]: team tests, Player 1's tests, Player 2's tests (same look as the judge's result boxes)
     grey = not submitted yet · red = submitted, not all passed yet · green = all passed (stays green) */
  .suites { display: inline-flex; gap: 3px; }
  .suites span {
    --c: var(--muted);
    display: inline-flex; align-items: center; justify-content: center; min-width: 1.6em; height: 1.6em; padding: 0 2px;
    border-radius: 4px; font: 700 .66rem/1 var(--font-mono);
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  }
  .suites span.none { opacity: .6; }
  .suites span.pass { --c: var(--ok); }
  .suites span.fail { --c: var(--err); }
  .tk-meta .level { font-size: .76rem; }
  /* special missions: which clan cleared it first */
  .first { display: inline-flex; align-items: center; gap: 4px; font: 600 .66rem var(--font-ui); color: var(--muted); }
  .first img { width: 16px; height: 16px; padding: 2px; border-radius: 4px; background: var(--clan); }
  .tk-wrap.solved .tk-name { color: var(--muted); }

  /* right side of a ticket: Cleared stamp, test progress, or Next up */
  .tk-state { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); }
  .stamp {
    display: inline-block; transform: rotate(-9deg); padding: 3px 8px; border-radius: 6px;
    font: 800 .66rem var(--font-ui); letter-spacing: .16em; text-transform: uppercase;
    color: var(--ok); border: 2px solid var(--ok); opacity: .9;
  }
  .prog { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; width: 80px; }
  .prog b { font: 700 .82rem/1 var(--font-mono); color: var(--c); }
  .prog small { font: 500 .62rem/1 var(--font-ui); color: var(--muted); }
  .prog .bar { width: 100%; height: 5px; }
  .pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font: 600 .7rem var(--font-ui); color: var(--accent-text); background: var(--accent); }

  .list-empty { margin: 24px 0; text-align: center; color: var(--muted); font-size: .9rem; }
  .list-empty b { display: block; color: var(--text); font-size: 1rem; margin-bottom: 4px; }

  @media (max-width: 820px) {
    body { overflow: auto; }
    /* phone: stacked — the timer on top, then the student and clan, then the links */
    .topnav { height: auto; padding: 10px 16px; grid-template-columns: minmax(0, 1fr); row-gap: 8px; justify-items: center; }
    .timer { order: -1; }
    .tn-right { justify-self: center; gap: 10px; max-width: 100%; }
    .tn-left { justify-self: center; order: 1; }
    .acc-who b { max-width: 9rem; }
    .home, .home[data-panel="full"] { height: auto; min-height: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: 34vh auto; }
    .home .panel, .home[data-panel="float"] .panel {
      position: static; width: auto; height: auto; min-height: 0; border: 0; border-top: 1px solid var(--border);
      border-radius: 0; box-shadow: none; backdrop-filter: none; animation: none;
    }
    .collapse { display: none; }
    .panel.min .filters, .panel.min .tickets { display: block; }
    .panel.min .filters { display: flex; }
    .tickets { overflow: visible; padding: 4px 16px 16px; }
    .filters, .panel-head { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tk-wrap, .bar > span, .panel { animation: none; transition: none; }
  }
</style>
</head>
<body>
<header class="topnav">
  <div class="tn-left">
    <div class="stat score" id="stat-score" title="Your clan's points from the missions you passed" hidden>
      <img src="icons/score.png" alt="">
      <div><b id="clan-score">0</b><small>Points</small></div>
    </div>
    <div class="stat money" id="stat-money" title="Your clan's money: every point you earn also gives 1 money" hidden>
      <img src="icons/money.png" alt="">
      <div><b id="clan-money">0</b><small>Money</small></div>
    </div>
  </div>
  <div class="timer off" id="timer" role="timer" aria-live="off">
    <small id="timer-label">Time left</small>
    <b id="timer-left">--:--</b>
  </div>
  <div class="tn-right">
    <div id="account" aria-label="Logged in as"></div>
    <div class="clan-chip" id="clan-chip" hidden>
      <img class="clan-logo" id="clan-logo" alt="">
    </div>
  </div>
</header>
<div class="home" id="home" data-panel="full">
  <section class="map" aria-label="Map">
    <!-- The board game (Unity web build in game/) is loaded into #map-canvas by the script at the end of this page. -->
    <div id="map-canvas"></div>
  </section>

  <aside class="panel" id="panel" aria-label="Missions">
    <header class="panel-head">
      <h1>Missions</h1>
      <button type="button" class="collapse" id="collapse" aria-expanded="true" aria-controls="tickets" title="Hide the list"><span class="chev">▾</span></button>
    </header>

    <div class="filters">
      <div class="rating" id="rating" role="group" aria-label="Filter by difficulty"></div>
      <div class="seg" id="seg" role="group" aria-label="Filter by status">
        <button type="button" data-status="all">All</button>
        <button type="button" data-status="todo">To do</button>
        <button type="button" data-status="done">Cleared</button>
      </div>
    </div>

    <nav class="tickets" id="tickets" aria-label="Problems"></nav>
  </aside>
</div>

<script src="js/problem-view.js"></script>
<script src="js/clan.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const PV = window.ProblemView;
const lvColor = (lv) => (lv === 'special' ? 'var(--sp1)' : `var(--lv${lv})`);


/* ---------- progress ---------- */
// Playing for a clan: everything comes from the clan (shared by all its members).
// Otherwise: what this browser saved.
Clan.requireLogin();
Clan.mountAccount($('account'));
// ` (outside text boxes) opens the Admin page, which asks for the admin password
document.addEventListener('keydown', (e) => {
  if (e.key === '`' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.target.closest('input, textarea, select, [contenteditable]')) {
    e.preventDefault(); location.href = 'admin.html';
  }
});
{
  const box = document.querySelector('.tn-right');
  $('clan-chip').addEventListener('click', (e) => { e.stopPropagation(); box.classList.toggle('open'); });
  document.addEventListener('click', (e) => { if (!box.contains(e.target) || e.target.closest('.acc-out')) box.classList.remove('open'); });
}
const CLAN = Clan.id();
let clan = null;    // { score, solved: Set, progress, started: Set }
let firsts = {};     // special missions: id -> clan that cleared it first
const isSolved = (p) => (clan ? clan.solved.has(p.id) : store.get('solved:' + p.id) === '1');
// Best Submit so far: { passed, total } over all of the problem's hidden tests (team + both players).
function progressOf(p) {
  if (clan) { const r = clan.progress[p.id]; return r && r.total > 0 ? r : null; }
  try {
    const r = JSON.parse(store.get('progress:' + p.id));
    if (r && r.total > 0) return r;
  } catch {}
  return null;
}
// Best result of each test set (team / p1 / p2) over all Submits: { passed, total }, or nothing yet.
function suiteResults(p) {
  if (clan) return (clan.suites || {})[p.id] || {};
  try { return JSON.parse(store.get('suites:' + p.id)) || {}; } catch { return {}; }
}
const SUITE_INFO = { team: ['T', 'Team tests'], p1: ['1', "Player 1's tests"], p2: ['2', "Player 2's tests"] };
function suiteBoxes(p) {
  const box = document.createElement('span');
  box.className = 'suites';
  const best = suiteResults(p);
  for (const s of p.suites || []) {
    const r = best[s];
    const b = document.createElement('span');
    const [label, name] = SUITE_INFO[s];
    b.textContent = label;
    if (!r || !r.total) { b.className = 'none'; b.title = `${name}: not submitted yet`; }
    else if (r.passed >= r.total) { b.className = 'pass'; b.title = `${name}: all ${r.total} passed`; }
    else { b.className = 'fail'; b.title = `${name}: best ${r.passed} / ${r.total} passed`; }
    box.appendChild(b);
  }
  return box;
}
const hasWork = (p) => (clan ? clan.started.has(p.id)
  : [`code:${p.id}:p1`, `code:${p.id}:p2`, `code:${p.id}:c`].some((k) => store.get(k) != null));

async function loadClan() {
  try {
    const s = await Clan.state();
    firsts = s.firsts || {};
    clan = s.clan ? { ...s, solved: new Set(s.solved), started: new Set(s.started) } : null;
  } catch { clan = null; }
}
// Top-right of the map: the clan's logo, name and score (the only place a score is shown).
// Top-left: the clan's score and money (a number bumps when it changes).
const shownStats = {};
function renderStats() {
  for (const [key, id] of [['score', 'clan-score'], ['money', 'clan-money']]) {
    const box = $('stat-' + key);
    box.hidden = !clan;
    if (!clan) continue;
    const value = clan[key] ?? 0;
    const el = $(id);
    el.textContent = value;
    if (shownStats[key] != null && value !== shownStats[key]) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    shownStats[key] = value;
  }
}
async function renderClanChip() {
  renderStats();
  const info = clan && await Clan.info(clan.clan);
  $('clan-chip').hidden = !info;
  if (!info) return;
  $('clan-chip').style.setProperty('--clan', info.color);
  $('clan-logo').src = Clan.logo(info.id);
  $('clan-logo').alt = info.name;
  $('clan-chip').title = `${info.name} · ${info.thai}`;
}

/* ---------- the camp timer (top bar) ---------- */
// The server sends how much time is left; the page counts down from that on its own and checks
// back every 15 s (so a pause or a new time from the admin shows up quickly).
let timerState = null, timerFetchedAt = 0;
async function loadTimer() {
  try {
    const r = await fetch('api/timer', { cache: 'no-store' });
    if (r.ok) { timerState = await r.json(); timerFetchedAt = performance.now(); }
  } catch {}
  renderTimer();
}
function timerLeft() {
  if (!timerState) return 0;
  return timerState.status === 'running' ? Math.max(0, timerState.leftMs - (performance.now() - timerFetchedAt)) : timerState.leftMs;
}
function formatTime(ms, withHours) {
  const s = Math.ceil(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const two = (n) => String(n).padStart(2, '0');
  return withHours ? `${h}:${two(m)}:${two(sec)}` : `${two(m)}:${two(sec)}`;
}
const TIMER_LABELS = { running: 'Time left', paused: 'Paused', ready: 'Starts soon', ended: 'Submitting closed', off: 'Time left' };
function renderTimer() {
  const box = $('timer');
  const s = timerState || { status: 'off', leftMs: 0, durationMs: 0 };
  const left = timerLeft();
  const status = s.status === 'running' && left <= 0 ? 'ended' : s.status;
  const text = status === 'off' ? '--:--' : status === 'ended' ? "TIME'S UP" : formatTime(left, s.durationMs >= 3600000);
  box.className = 'timer ' + status + (status === 'running' && left < 5 * 60000 ? ' low' : '');
  $('timer-label').textContent = TIMER_LABELS[status] || 'Time left';
  if ($('timer-left').textContent !== text) $('timer-left').textContent = text;
}
setInterval(renderTimer, 250);
setInterval(() => { if (!document.hidden) loadTimer(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadTimer(); });
loadTimer();

/* ---------- state ---------- */
let problems = [];
const filter = { level: store.get('home:level') || 'all', status: store.get('home:status') || 'all' };

/* ---------- filters ---------- */
// Example missions (0 stars) come first, then special missions, then 1 to 6 stars.
const ORDER = ['0', 'special', '1', '2', '3', '4', '5', '6'];
const levelOf = (p) => PV.normalizeLevel(p.difficulty);
const has = (lv) => problems.some((p) => levelOf(p) === lv);

// Five stars (a sixth once a 6-star mission exists), plus ◆ once a special mission exists
// and ☆ once an example mission exists.
// Clicking the 3rd star shows level 3; clicking the lit star again shows every level.
function renderChips() {
  const box = $('rating');
  box.textContent = '';
  const values = [...(has('0') ? ['0'] : []), ...(has('special') ? ['special'] : []), '1', '2', '3', '4', '5', ...(has('6') ? ['6'] : [])];
  for (const v of values) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.level = v;
    b.className = v === 'special' ? 'sp' : v === '0' ? 'ex' : '';
    b.textContent = v === 'special' ? '◆' : v === '0' ? '☆' : '★';
    b.title = PV.levelName(v);
    b.setAttribute('aria-label', PV.levelName(v));
    b.addEventListener('click', () => setFilter('level', filter.level === v ? 'all' : v));
    b.addEventListener('mouseenter', () => paintStars(v));
    b.addEventListener('focus', () => paintStars(v));
    box.appendChild(b);
  }
  box.onmouseleave = () => paintStars(filter.level);
  paintStars(filter.level);
  for (const b of $('seg').children) b.setAttribute('aria-pressed', String(b.dataset.status === filter.status));
}
// Light stars 1..n in level n's color (or just ◆ for special).
function paintStars(level) {
  for (const b of $('rating').children) {
    const v = b.dataset.level;
    const on = level !== 'all' && (level === 'special' || level === '0' ? v === level
      : v !== 'special' && v !== '0' && Number(v) <= Number(level));
    b.classList.toggle('on', on);
    b.style.setProperty('--c', level === 'all' ? '' : lvColor(level));
    b.setAttribute('aria-pressed', String(filter.level === v));
  }
}
function setFilter(key, value) {
  filter[key] = value;
  store.set('home:' + key, value);
  renderChips();
  renderTickets();
}
for (const b of $('seg').children) b.addEventListener('click', () => setFilter('status', b.dataset.status));

/* ---------- tickets ---------- */
// The first problem not cleared yet, easiest level first.
const nextUp = () => problems.find((p) => !isSolved(p));
function visible() {
  return problems.filter((p) =>
    (filter.level === 'all' || levelOf(p) === filter.level) &&
    (filter.status === 'all' || (filter.status === 'done' ? isSolved(p) : !isSolved(p))));
}
function ticket(p, i) {
  const lv = PV.normalizeLevel(p.difficulty);
  const a = document.createElement('a');
  a.className = 'tk-wrap' + (lv === 'special' ? ' special' : '') + (isSolved(p) ? ' solved' : '');
  a.href = 'play.html#problem=' + encodeURIComponent(p.id);
  a.style.setProperty('--c', lvColor(lv));
  a.style.animationDelay = Math.min(i * 40, 400) + 'ms';
  a.innerHTML = `
    <div class="ticket">
      <div class="stub"><span class="no">Nº</span><span class="num"></span></div>
      <div class="tk-main">
        <div class="tk-name"></div>
        <div class="tk-meta"></div>
        <div class="tk-state"></div>
      </div>
    </div>`;
  a.querySelector('.num').textContent = p.number || '?';
  a.querySelector('.tk-name').textContent = p.name || 'Untitled';
  a.querySelector('.tk-meta').appendChild(PV.levelElement(lv));
  if ((p.suites || []).length) a.querySelector('.tk-meta').appendChild(suiteBoxes(p));
  if (firsts[p.id]) {
    // which clan got there first (filled in once the clan list has loaded)
    const f = document.createElement('span');
    f.className = 'first';
    f.innerHTML = '<img alt="">1st';
    Clan.info(firsts[p.id]).then((c) => {
      if (!c) return f.remove();
      f.style.setProperty('--clan', c.color);
      f.querySelector('img').src = Clan.logo(c.id);
      f.title = `First cleared by ${c.name}`;
    });
    a.querySelector('.tk-meta').appendChild(f);
  }
  a.setAttribute('aria-label', `${p.name || 'Untitled'}, ${PV.levelName(lv)}`);

  const state = a.querySelector('.tk-state');
  const prog = progressOf(p);
  if (isSolved(p)) {
    state.innerHTML = '<span class="stamp">Cleared</span>';
  } else if (prog || hasWork(p)) {
    const pct = prog ? Math.floor((prog.passed / prog.total) * 100) : 0;
    state.innerHTML = '<div class="prog"><b></b><span class="bar"><span></span></span><small></small></div>';
    state.querySelector('b').textContent = pct + '%';
    state.querySelector('small').textContent = prog ? `${prog.passed} / ${prog.total} tests` : 'not submitted';
    requestAnimationFrame(() => { state.querySelector('.bar > span').style.width = pct + '%'; });
    a.title = prog ? `Best submit: ${prog.passed} of ${prog.total} hidden tests passed` : 'Started, not submitted yet';
  } else if (nextUp() === p) {
    state.innerHTML = '<span class="pill">Next up</span>';
  }
  return a;
}
function renderTickets() {
  const box = $('tickets');
  box.textContent = '';
  const list = visible();
  if (!problems.length) {
    box.innerHTML = '<p class="list-empty"><b>No problems yet</b>Open the <a href="admin.html">Admin page</a> to add your first one.</p>';
  } else if (!list.length) {
    const none = filter.level !== 'all' && !has(filter.level);
    box.innerHTML = `<p class="list-empty"><b>${none ? 'No missions at this level yet' : filter.status === 'done' ? 'Nothing cleared here yet' : 'All cleared here 🎉'}</b>Try another filter.</p>`;
  }
  let i = 0;
  for (const lv of ORDER) {
    const inLevel = list.filter((p) => levelOf(p) === lv);
    if (!inLevel.length) continue;
    const all = problems.filter((p) => levelOf(p) === lv);
    const done = all.filter(isSolved).length;
    const g = document.createElement('section');
    g.className = 'group';
    g.innerHTML = '<div class="group-head"><span class="gct"></span><span class="bar"><span></span></span></div>';
    const head = g.firstElementChild;
    head.prepend(PV.levelElement(lv, { specialLabel: 'LARP' }));
    head.querySelector('.gct').textContent = `${done} / ${all.length}`;
    head.style.setProperty('--c', lvColor(lv));
    head.classList.toggle('special', lv === 'special');
    requestAnimationFrame(() => { head.querySelector('.bar > span').style.width = (done / all.length) * 100 + '%'; });
    for (const p of inLevel) g.appendChild(ticket(p, i++));
    box.appendChild(g);
  }
}

/* ---------- hide / show the list (floating card only) ---------- */
function setCollapsed(min) {
  $('panel').classList.toggle('min', min);
  $('collapse').setAttribute('aria-expanded', String(!min));
  $('collapse').title = min ? 'Show the list' : 'Hide the list';
  store.set('home:min', min ? '1' : '0');
}
$('collapse').addEventListener('click', () => setCollapsed(!$('panel').classList.contains('min')));
setCollapsed(store.get('home:min') === '1');

/* ---------- start ---------- */
async function load() {
  try {
    const [list] = await Promise.all([fetch('api/problems').then((r) => r.json()), loadClan()]);
    // special first, then easiest first, then by number
    problems = list.slice().sort((a, b) =>
      ORDER.indexOf(levelOf(a)) - ORDER.indexOf(levelOf(b)) ||
      String(a.number).localeCompare(String(b.number), undefined, { numeric: true }));
  } catch {
    $('tickets').innerHTML = '<p class="list-empty"><b>Server offline</b>Start it with start.bat, then refresh.</p>';
    return;
  }
  // a saved filter for a 6-star / special / example level that no longer has missions
  if (['6', 'special', '0'].includes(filter.level) && !has(filter.level)) filter.level = 'all';
  renderChips();
  renderTickets();
  renderClanChip();
  lastClanJson = clanJson();
}
// Coming back with the browser's Back button: refresh progress.
window.addEventListener('pageshow', (e) => { if (e.persisted) load(); });
// Clanmates clear missions too: refresh the clan's progress every 10 s while the map is open.
let lastClanJson = '';
const clanJson = () => JSON.stringify([clan && clan.score, clan && clan.money, clan && [...clan.solved], clan && clan.progress, clan && clan.suites, clan && [...clan.started], firsts]);
setInterval(async () => {
  if (document.hidden || !problems.length || (window.SubPage && SubPage.isOpen())) return;
  await loadClan();
  const json = clanJson();
  if (json === lastClanJson) return;
  lastClanJson = json;
  renderChips();
  renderTickets();
  renderClanChip();
}, 10000);
load();
</script>

<style>
  /* a mission opens on top of the map (play.html in a frame), so the board never has to reload */
  .subpage { position: fixed; inset: 0; z-index: 1000; display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .subpage[hidden] { display: none; }
  html.sub-open, html.sub-open body { overflow: hidden; }
</style>
<script>
/* ---------- missions open on top of the map ----------
   Clicking a mission loads play.html in a full-screen frame over this page instead of leaving it, so the
   Unity board stays loaded (and is paused while the frame is up: no lag, no reload when coming back).
   The address bar still shows play.html#problem=…, so Refresh or a copied link opens the normal play page,
   and the browser's Back button closes the frame. play.html's "← Map" calls SubPage.close() when framed.
   Ctrl/middle-click on a mission still opens it in a new tab as before. */
/* Pausing the board (Module.pauseMainLoop) while any reason is set. Only reason now: a mission frame is
   open (the board is hidden then). On the main page itself the board always runs, effects and all
   (the user wants that; pausing while the Missions panel was hovered was tried and removed). */
window.BoardPause = (function () {
  const why = new Set();
  let paused = false;
  function apply() {
    const m = window.boardGame && window.boardGame.Module;   // Unity's Emscripten module
    const want = why.size > 0;
    if (!m || want === paused) return;
    try { if (want) m.pauseMainLoop(); else m.resumeMainLoop(); paused = want; } catch (e) { console.warn('board pause', e); }
  }
  return { set(reason, on) { if (on) why.add(reason); else why.delete(reason); apply(); }, apply };
})();

window.SubPage = (function () {
  const homeUrl = location.pathname + location.search;
  let frame = null;

  const boardPause = (on) => BoardPause.set('mission-open', on);
  function setPageInert(on) {
    for (const el of document.body.children) if (el !== frame && !/^(SCRIPT|STYLE)$/.test(el.tagName)) el.inert = on;
  }
  function show(url) {
    const want = new URL(url, location.href).href;
    if (!frame) {
      frame = document.createElement('iframe');
      frame.className = 'subpage';
      frame.title = 'Mission';
      frame.allowFullscreen = true;
      frame.src = want;            // first load: adds no history entry
      document.body.appendChild(frame);
    } else if (frame.dataset.url !== want) {
      frame.contentWindow.location.replace(want);   // replace: keeps Back working as "close"
    }
    frame.dataset.url = want;
    frame.hidden = false;
    document.documentElement.classList.add('sub-open');
    setPageInert(true);
    boardPause(true);
    frame.focus();
  }
  function hide() {
    if (!frame || frame.hidden) return;
    // unload the mission page (it saves the code on pagehide) and stop its polling
    try { frame.contentWindow.location.replace('about:blank'); } catch {}
    frame.dataset.url = '';
    frame.hidden = true;
    document.documentElement.classList.remove('sub-open');
    setPageInert(false);
    boardPause(false);
    if (typeof load === 'function') load();   // scores / progress may have changed
  }
  const onPlay = () => /\/play\.html$/.test(location.pathname);

  window.addEventListener('popstate', () => (onPlay() ? show(location.href) : hide()));
  document.getElementById('tickets').addEventListener('click', (e) => {
    const a = e.target.closest('a.tk-wrap');
    if (!a || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    history.pushState({ sub: true }, '', a.getAttribute('href'));
    show(a.href);
  });

  return {
    isOpen: () => !!frame && !frame.hidden,
    close() {
      if (history.state && history.state.sub) history.back();   // popstate hides it
      else { history.replaceState(null, '', homeUrl); hide(); }
    },
    // play.html switched problem inside the frame: keep the address bar in step
    sync(hash) { if (frame && !frame.hidden && onPlay()) history.replaceState(history.state, '', 'play.html' + hash); },
    boardPause,
  };
})();
</script>

<script>
/* ---------- the board game in #map-canvas ----------
   Unity web build of Game/BJKIT, made in Unity with Tools > Board > Build Web (into website).
   game/build.json lists the build's file names; without it (not built yet) the map just stays empty.
   The GIF loading screen (js/loader.js) stays up until the board is really on screen, with a progress bar
   under the GIF (at most 90 s; after that the map shows its own bar). "Really on screen" = after Unity's
   "Made with Unity" splash has faded out: the game calls window.BoardPage.ready() then
   (Game/BJKIT/Assets/Plugins/WebGL/BoardBridge.jslib + Scripts/Board/BoardPageSignal.cs). */
(async function loadBoard() {
  let boardSettled;
  const boardReady = new Promise((r) => (boardSettled = r));
  if (window.PageLoader && PageLoader.holdUntil) PageLoader.holdUntil(boardReady, 90000);
  window.BoardPage = { ready: () => boardSettled() };

  let build;
  try {
    const r = await fetch('game/build.json', { cache: 'no-store' });
    if (!r.ok) return boardSettled();
    build = await r.json();
  } catch { return boardSettled(); }

  const host = document.getElementById('map-canvas');
  host.innerHTML = '<canvas id="board-canvas" tabindex="-1" aria-label="Board"></canvas>'
    + '<div class="board-fade" id="board-fade"></div>'
    + '<div class="board-load" id="board-load"><span>Loading the board…</span><div class="bar"><i></i></div></div>';
  const canvas = document.getElementById('board-canvas');
  const loading = document.getElementById('board-load');
  const fade = document.getElementById('board-fade');
  // fade in from black once the GIF loading screen has gone (its own fade is ~0.3 s)
  boardReady.then(() => setTimeout(() => {
    fade.classList.add('out');
    setTimeout(() => fade.remove(), 1600);
  }, 350));
  const fail = (e) => {
    console.error('Board failed to load:', e);
    fade.remove();
    boardSettled();
    loading.classList.add('failed');
    loading.querySelector('span').textContent = 'The board could not load. Refresh the page to try again.';
  };

  const script = document.createElement('script');
  script.src = 'game/Build/' + build.loader;
  script.onerror = fail;
  script.onload = () => {
    createUnityInstance(canvas, {
      dataUrl: 'game/Build/' + build.data,
      frameworkUrl: 'game/Build/' + build.framework,
      codeUrl: 'game/Build/' + build.code,
      streamingAssetsUrl: 'game/StreamingAssets',
      companyName: 'BJKIT', productName: build.productName || 'Board', productVersion: build.productVersion || '1',
      devicePixelRatio: 1,   // full sharpness on high-DPI screens costs 2-4x the GPU work; 1 keeps the page smooth
    }, (p) => {
      loading.querySelector('i').style.width = Math.round(p * 100) + '%';
      if (window.PageLoader && PageLoader.progress) PageLoader.progress(p);
    })
      .then((instance) => {
        window.boardGame = instance;   // later: instance.SendMessage(...) to move clan pawns
        if (window.BoardPause) BoardPause.apply();   // a pause asked for while it was still loading
        // Which graphics API the build ended up on (WebGPU first, WebGL2 fallback: see WebBuild.UseGraphicsApis).
        // A canvas that already holds a WebGPU context returns null for getContext('webgl2').
        instance.graphicsApi = canvas.getContext('webgl2') ? 'WebGL2' : 'WebGPU';
        console.info('[board] graphics API:', instance.graphicsApi);
        loading.remove();
        host.closest('.map').classList.add('has-board');
        // The loader fades when the game says the splash is over (BoardPage.ready). Safety net for a build
        // without that signal: the Unity splash lasts a few seconds, so give up waiting after 12 s.
        setTimeout(boardSettled, 12000);
      })
      .catch(fail);
  };
  document.body.appendChild(script);
})();

// The automatic resolution drop that used to be here (adaptBoardResolution) was removed: the user wants the
// board at 100%. Lag is handled by a lighter web-only renderer instead (Game/BJKIT/Assets/Editor/WebBuild.cs).
try { localStorage.removeItem('board:scale'); } catch {}
</script>
</body>
</html>
